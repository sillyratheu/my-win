name: Windows True RDP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Enable Windows RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Set Administrator Password
      run: |
        net user runneradmin RdpPassword123!

    - name: Start Serveo Tunnel & Auto-Update Website URL
      shell: pwsh
      run: |
        Write-Host "Starting Serveo Tunnel..."
        git config --global user.name "RDP Bot"
        git config --global user.email "bot@github.com"

        $processInfo = New-Object System.Diagnostics.ProcessStartInfo
        $processInfo.FileName = "ssh"
        $processInfo.Arguments = "-n -T -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R 0:localhost:3389 serveo.net"
        $processInfo.RedirectStandardOutput = $true
        $processInfo.RedirectStandardError = $true
        $processInfo.UseShellExecute = $false
        
        $process = [System.Diagnostics.Process]::Start($processInfo)

        while (-not $process.HasExited) {
            $line = $process.StandardOutput.ReadLine()
            if (-not $line) {
                $line = $process.StandardError.ReadLine()
            }
            if ($line) {
                Write-Host $line
                if ($line -match "Forwarding TCP connections from") {
                    $matched = [regex]::Match($line, '([a-zA-Z0-9.-]+\.[a-zA-Z]{2,})\s+(\d+)')
                    if ($matched.Success) {
                        $hostPart = $matched.Groups[1].Value
                        $portPart = $matched.Groups[2].Value
                        $url = "$hostPart:$portPart"
                        Write-Host "Generated URL: $url"
                        Set-Content -Path "rdp-url.txt" -Value $url
                        
                        git add rdp-url.txt
                        git commit -m "Auto update Windows RDP URL [skip ci]" --allow-empty
                        git push
                    }
                }
            }
        }
        
