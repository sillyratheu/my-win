name: Windows True RDP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Enable Windows RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Set Administrator Password
      run: |
        net user runneradmin RdpPassword123!

    - name: Download & Start Bore Tunnel
      shell: pwsh
      run: |
        Write-Host "Downloading Bore..."
        Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip" -OutFile bore.zip
        Expand-Archive bore.zip -DestinationPath .
        
        Write-Host "Starting Bore Tunnel..."
        git config --global user.name "RDP Bot"
        git config --global user.email "bot@github.com"

        $processInfo = New-Object System.Diagnostics.ProcessStartInfo
        $processInfo.FileName = ".\bore.exe"
        $processInfo.Arguments = "local 3389 --to bore.pub"
        $processInfo.RedirectStandardOutput = $true
        $processInfo.RedirectStandardError = $true
        $processInfo.UseShellExecute = $false
        
        $process = [System.Diagnostics.Process]::Start($processInfo)

        while (-not $process.HasExited) {
            $line = $process.StandardOutput.ReadLine()
            if (-not $line) {
                $line = $process.StandardError.ReadLine()
            }
            if ($line) {
                Write-Host $line
                if ($line -match "bore\.pub") {
                    $matched = [regex]::Match($line, 'bore\.pub:\d+')
                    if ($matched.Success) {
                        $url = $matched.Value
                        Write-Host "Generated URL: $url"
                        Set-Content -Path "rdp-url.txt" -Value $url
                        
                        git add rdp-url.txt
                        git commit -m "Auto update Windows RDP URL [skip ci]" --allow-empty
                        git push
                    }
                }
            }
        }
        
